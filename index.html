<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Budget Planner with Charts</title>

    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="container">

        <header>
            <h1>💰 Budget Planner</h1>
            <p>Track your monthly budget and expenses easily</p>
        </header>

        <!-- Summary -->
        <section class="summary">

            <div class="summary-card">
                <span>💵 Total Budget</span>
                <h2 id="totalBudget">₹0</h2>
            </div>

            <div class="summary-card">
                <span>💸 Total Spent</span>
                <h2 id="totalSpent">₹0</h2>
            </div>

            <div class="summary-card">
                <span>💚 Remaining</span>
                <h2 id="remaining">₹0</h2>
            </div>

        </section>

        <!-- Budget Form -->
        <section class="card">

            <h2>Set Category Budget</h2>

            <form id="budgetForm">

                <div class="form-group">
                    <label for="budgetCategory">Category</label>

                    <select id="budgetCategory" required>
                        <option value="">Select Category</option>
                        <option value="Food">🍔 Food</option>
                        <option value="Travel">🚗 Travel</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Bills">💡 Bills</option>
                        <option value="Education">📚 Education</option>
                        <option value="Entertainment">🎮 Entertainment</option>
                        <option value="Health">🏥 Health</option>
                        <option value="Other">📦 Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="budgetAmount">Budget Amount</label>

                    <input
                        type="number"
                        id="budgetAmount"
                        placeholder="Enter budget"
                        min="0"
                        required
                    >
                </div>

                <button type="submit">Set Budget</button>

            </form>

        </section>

        <!-- Expense Form -->
        <section class="card">

            <h2>➕ Add Expense</h2>

            <form id="expenseForm">

                <div class="form-group">
                    <label for="expenseCategory">Category</label>

                    <select id="expenseCategory" required>
                        <option value="">Select Category</option>
                        <option value="Food">🍔 Food</option>
                        <option value="Travel">🚗 Travel</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Bills">💡 Bills</option>
                        <option value="Education">📚 Education</option>
                        <option value="Entertainment">🎮 Entertainment</option>
                        <option value="Health">🏥 Health</option>
                        <option value="Other">📦 Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="expenseAmount">Amount</label>

                    <input
                        type="number"
                        id="expenseAmount"
                        placeholder="Enter expense"
                        min="0"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="expenseDescription">Description</label>

                    <input
                        type="text"
                        id="expenseDescription"
                        placeholder="Example: Grocery shopping"
                        required
                    >
                </div>

                <button type="submit">Add Expense</button>

            </form>

        </section>

        <!-- Budget Status -->
        <section class="card">

            <div class="section-heading">
                <h2>📊 Budget Status</h2>

                <button class="reset-btn" id="resetBtn">
                    Reset All
                </button>
            </div>

            <div id="budgetList"></div>

        </section>

        <!-- Chart -->
        <section class="card chart-card">

            <h2>📈 Budget vs Actual Spending</h2>

            <div class="chart-container">
                <canvas id="budgetChart"></canvas>
            </div>

        </section>

        <!-- Expense List -->
        <section class="card">

            <h2>🧾 Recent Expenses</h2>

            <div id="expenseList"></div>

        </section>

        <footer>
            <p>Budget Planner | HTML • CSS • JavaScript • Chart.js</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
